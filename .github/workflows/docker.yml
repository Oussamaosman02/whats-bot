# Builds the production image on GitHub's runners and pushes it to GHCR.
# Dokploy (whats-bot.foodio.es) only pulls and runs ghcr.io/oussamaosman02/whats-bot:latest —
# the VPS is too small to run `next build` itself (it took the server down on 2026-11-08).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/oussamaosman02/whats-bot:latest
            ghcr.io/oussamaosman02/whats-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
